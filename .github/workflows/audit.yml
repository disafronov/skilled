---
name: Audit
"on":
  pull_request:
    branches: [main, rc]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Read Python version
        id: python_version
        run: echo "version=$(cat .python-version | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ steps.python_version.outputs.version }}
          cache-suffix: ${{ steps.python_version.outputs.version }}
      - name: Audit dependencies
        run: make audit
